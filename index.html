<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babylon.js WebXR FOV Control (Quest 3)</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      color: #fff; font-family: monospace; background: rgba(0,0,0,0.5);
      padding: 8px 12px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="ui">🎮 Use Quest joystick ↑↓ — FOV: <span id="fovVal">90</span>°</div>
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    import * as BABYLON from "https://cdn.jsdelivr.net/npm/babylonjs@7.50.0/+esm";

    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    // Simple environment
    const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 1.6, -3), scene);
    camera.attachControl(canvas, true);

    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 1.2;

    const box = BABYLON.MeshBuilder.CreateBox("box", { size: 1 }, scene);
    box.position.y = 1;

    const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 10, height: 10 }, scene);

    // WebXR setup
    const xr = await scene.createDefaultXRExperienceAsync({
      floorMeshes: [ground]
    });

    // FOV logic
    let fov = BABYLON.Tools.ToRadians(90);
    let targetFOV = fov;
    const minFOV = BABYLON.Tools.ToRadians(60);
    const maxFOV = BABYLON.Tools.ToRadians(130);
    const fovDisplay = document.getElementById("fovVal");

    function updateFOV(delta) {
      targetFOV = BABYLON.Scalar.Clamp(targetFOV + BABYLON.Tools.ToRadians(delta), minFOV, maxFOV);
      fovDisplay.textContent = BABYLON.Tools.ToDegrees(targetFOV).toFixed(0);
    }

    // Device Source Manager (handles Quest controllers, keyboard, etc)
    const dsm = new BABYLON.DeviceSourceManager(engine);

    // Keyboard fallback
    scene.onKeyboardObservable.add((kb) => {
      if (kb.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
        if (kb.event.key === "ArrowUp") updateFOV(-2);
        if (kb.event.key === "ArrowDown") updateFOV(2);
      }
    });

    // Each frame, poll controllers
    scene.onBeforeRenderObservable.add(() => {
      // Check all registered devices (Quest controllers show as "Generic")
      const generic = dsm.getDeviceSource(BABYLON.DeviceType.Generic, 0);
      const genericR = dsm.getDeviceSource(BABYLON.DeviceType.Generic, 1);

      let vertical = 0;
      if (generic && generic.getInput(3) !== undefined) vertical = generic.getInput(3); // right stick Y
      if (genericR && Math.abs(genericR.getInput(3)) > Math.abs(vertical))
        vertical = genericR.getInput(3);

      if (Math.abs(vertical) > 0.2) updateFOV(vertical * 1.5);

      // Smoothly adjust camera FOV
      fov = BABYLON.Scalar.Lerp(fov, targetFOV, 0.1);
      xr.baseExperience.camera.fov = fov;
    });

    // Render loop
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
